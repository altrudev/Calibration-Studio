name: Security and adversarial gate

on:
  push:
    branches: ["main", "migration/**", "feature/**", "release/**"]
    paths:
      - "src/**"
      - "bin/**"
      - "tests/**"
      - "schemas/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "src/**"
      - "bin/**"
      - "tests/**"
      - "schemas/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/security.yml"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install exact dependency graph with lifecycle scripts disabled
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
      - name: Syntax and full regression suite
        run: |
          npm run check
          npm test
      - name: Execution primitive guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE '\bexec(Sync|File|FileSync)?\s*\(|\beval\s*\(|\bnew[[:space:]]+Function\s*\(' src bin \
            --include='*.js' --include='*.mjs' --include='*.cjs'; then
            echo 'Forbidden dynamic/shell execution primitive detected.' >&2
            exit 1
          fi
      - name: Remote runtime asset guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE '<(script|link)[^>]+https?://' ui; then
            echo 'Remote UI runtime asset detected.' >&2
            exit 1
          fi
      - name: Private DDC implementation leakage guard
        shell: bash
        run: |
          set -euo pipefail
          forbidden='derive_closure|constraint[-_ ]island|lattice propagation|successor-state machinery|private dimensional signals|ParticipantLockManager|FileHeadStore|CrystallineEngine|NativeCrystal|NativePrepared'
          for root in src bin tests schemas ui; do
            if [ -e "$root" ] && grep -RniE "$forbidden" "$root"; then
              echo 'Private DDC implementation vocabulary leaked into product surface.' >&2
              exit 1
            fi
          done
      - name: Hard-coded secret material guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE --exclude-dir=node_modules --exclude-dir=.git \
            '-----BEGIN [A-Z ]*PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' .; then
            echo 'Potential hard-coded secret material detected.' >&2
            exit 1
          fi
