name: Calibration Studio preview release

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  package:
    if: "${{ startsWith(github.event.head_commit.message, 'release: Calibration Studio v0.11.0-alpha.0') }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: linux-x64
            expected_arch: x64
            archive: tar.gz
          - os: windows-latest
            package: windows-x64
            expected_arch: x64
            archive: zip
          - os: macos-15-intel
            package: macos-x64
            expected_arch: x64
            archive: tar.gz
          - os: macos-15
            package: macos-arm64
            expected_arch: arm64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.18.1"
          package-manager-cache: false
      - name: Verify release identity
        shell: bash
        run: |
          node -e "const p=require('./package.json');if(p.version!=='0.11.0-alpha.0')throw new Error('unexpected version '+p.version);if(process.arch!=='${{ matrix.expected_arch }}')throw new Error('unexpected arch '+process.arch)"
      - name: Install exact graph and browser runtime
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild node-pty --foreground-scripts
          npm run check
          npm test
          npm run runtime:install-browser
          npm run runtime:verify-browser
      - name: Stage release
        shell: bash
        run: |
          rm -rf build dist
          mkdir -p build/standalone dist
          node src/release/stage-standalone.js --output build/standalone > build/stage-result.json
          node src/release/size-report.js build/standalone > "dist/Calibration-Studio-v0.11.0-alpha.0-${{ matrix.package }}.size.json"
          cp build/standalone/calibration-release-manifest.json "dist/Calibration-Studio-v0.11.0-alpha.0-${{ matrix.package }}.manifest.json"
      - name: Archive Unix package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          NAME="Calibration-Studio-v0.11.0-alpha.0-${{ matrix.package }}"
          tar -czf "dist/$NAME.tar.gz" -C build standalone
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "dist/$NAME.tar.gz" > "dist/$NAME.tar.gz.sha256"; else shasum -a 256 "dist/$NAME.tar.gz" > "dist/$NAME.tar.gz.sha256"; fi
      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = 'Calibration-Studio-v0.11.0-alpha.0-${{ matrix.package }}'
          $archive = Join-Path 'dist' ($name + '.zip')
          Compress-Archive -Path 'build\standalone\*' -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          ($hash + '  ' + [System.IO.Path]::GetFileName($archive)) | Out-File -Encoding ascii ($archive + '.sha256')
      - uses: actions/upload-artifact@v4
        with:
          name: Calibration-Studio-v0.11.0-alpha.0-${{ matrix.package }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: Calibration-Studio-v0.11.0-alpha.0-*
          path: release-assets
          merge-multiple: true
      - name: Publish canonical preview release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          # Calibration Studio v0.11.0-alpha.0

          First canonical preview produced from the dedicated `altrudev/Calibration-Studio` repository after extraction from DDC.

          Platforms: Linux x64, Windows x64, macOS Intel x64, macOS Apple Silicon arm64.

          The product is standalone and local-first. Private DDC/Crystalline implementation source is not included. DDC integration is through explicit versioned provider/consumer boundaries.

          This is a preview/candidate release, not Calibration Studio 1.0. Windows publisher signing and macOS notarization remain future production-distribution work.
          EOF
          gh release create v0.11.0-alpha.0 release-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Calibration Studio v0.11.0-alpha.0" --notes-file release-notes.md --prerelease
