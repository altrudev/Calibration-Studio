name: Public boundary

on:
  push:
    branches: ["main", "migration/**", "feature/**", "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject private DDC implementation leakage
        shell: bash
        run: |
          set -euo pipefail
          forbidden='derive_closure|constraint[-_ ]island|lattice propagation|successor-state machinery|private dimensional signals|ParticipantLockManager|FileHeadStore|CrystallineEngine|NativeCrystal|NativePrepared'
          if grep -RniE "$forbidden" . \
            --exclude-dir=.git \
            --exclude='DDC-INTEGRATION.md' \
            --exclude='MIGRATION.md'; then
            echo 'Private DDC implementation vocabulary leaked into Calibration Studio source.' >&2
            exit 1
          fi
      - name: Reject committed secrets and private keys
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '.env' \) -not -path './.git/*' | grep -q .; then
            echo 'Secret/key material must not be committed.' >&2
            exit 1
          fi
      - name: Validate provider schemas
        run: |
          node -e "for (const f of ['schemas/ddc-provider-0.1.schema.json','schemas/ddc-provider-result-0.1.schema.json']) JSON.parse(require('fs').readFileSync(f,'utf8'));"
