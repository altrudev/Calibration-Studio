name: Standalone Linux migration gate

on:
  push:
    branches: ["main", "migration/**", "release/**"]
    paths:
      - "src/**"
      - "bin/**"
      - "ui/**"
      - "docs/**"
      - "schemas/**"
      - "samples/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/standalone-linux.yml"
  pull_request:
    paths:
      - "src/**"
      - "bin/**"
      - "ui/**"
      - "docs/**"
      - "schemas/**"
      - "samples/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/standalone-linux.yml"

permissions:
  contents: read

jobs:
  stage-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.18.1"
          package-manager-cache: false
      - name: Install exact dependency graph
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild node-pty --foreground-scripts
      - name: Install pinned browser runtime
        run: |
          npm run runtime:install-browser
          npm run runtime:verify-browser
      - name: Stage standalone package
        run: |
          mkdir /tmp/calibration-standalone
          npm run standalone:stage -- --output /tmp/calibration-standalone > /tmp/stage-result.json
          node src/release/size-report.js /tmp/calibration-standalone > /tmp/size.json
          node - <<'NODE'
          const s=require('/tmp/stage-result.json');
          const z=require('/tmp/size.json');
          if(s.status!=='staged') throw new Error('standalone stage failed');
          if(s.release.node.version!=='v24.18.1') throw new Error(`wrong Node ${s.release.node.version}`);
          if(s.release.browser.playwright_version!=='1.62.1'||s.release.browser.chromium_installed!==true) throw new Error('browser runtime mismatch');
          if(!s.manifest.id.startsWith('RELEASE-')) throw new Error('release identity missing');
          if(!(z.total_bytes>0)) throw new Error('size report missing');
          NODE
      - name: Launch staged package using bundled runtime
        run: |
          /tmp/calibration-standalone/calibrate version > /tmp/staged-version.json
          /tmp/calibration-standalone/calibrate adapters > /tmp/staged-adapters.json
          /tmp/calibration-standalone/ddc-intent compile --intent /tmp/calibration-standalone/app/samples/intent-happyhr-ui.json > /tmp/staged-intent.json
          node - <<'NODE'
          const v=require('/tmp/staged-version.json');
          const a=require('/tmp/staged-adapters.json');
          const i=require('/tmp/staged-intent.json');
          if(v.version!=='0.11.0-alpha.0') throw new Error('staged version mismatch');
          if(!a.adapters.some(x=>x.id==='cli'&&x.status==='candidate')) throw new Error('staged adapters missing');
          if(i.schema!=='altru-intent-contract/0.1') throw new Error('staged Intent probe failed');
          NODE
      - name: Upload migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: calibration-studio-v0.11-alpha-linux-x64
          path: |
            /tmp/calibration-standalone
            /tmp/size.json
          if-no-files-found: error
          retention-days: 7
