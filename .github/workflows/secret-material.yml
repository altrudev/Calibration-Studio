name: Secret material guard

on:
  push:
    branches: ["main", "migration/**", "feature/**", "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  secret-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject committed key/env files
        shell: bash
        run: |
          set -euo pipefail
          bad=$(find . -type f \( -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '.env' \) -not -path './.git/*' -print)
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad"
            echo 'Secret/key material must not be committed.' >&2
            exit 1
          fi
      - name: Reject common hard-coded credential material
        shell: bash
        run: |
          set -euo pipefail
          matches=$(grep -RniE --exclude-dir=node_modules --exclude-dir=.git --exclude='redaction.js' -- \
            '-----BEGIN [A-Z][A-Z ]* PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' . || true)
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo 'Potential hard-coded credential material detected.' >&2
            exit 1
          fi
